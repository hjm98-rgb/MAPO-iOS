name: Build unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -e
          xcodebuild \
            -project MAPO.xcodeproj \
            -scheme MAPO \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -e
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "MAPO.app" -maxdepth 1 | head -1)
          echo "app: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry MAPO-unsigned.ipa Payload
          ls -lh MAPO-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MAPO-unsigned-ipa
          path: MAPO-unsigned.ipa
