<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>html,body{margin:0;height:100%;background:#0a0812;overflow:hidden;font-family:monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px}
.c{width:64px;height:64px;border-radius:12px;background:#1b1730;display:flex;align-items:center;justify-content:center;font-size:24px;color:transparent;user-select:none;transition:.25s}
.c.f{background:#2a2450;color:#8f7bff}.c.ok{background:#8f7bff33;color:#8f7bff}
#s{color:#8f7bff;font-size:13px}</style></head><body>
<div id="s">配对数 0 / 8</div><div id="g"></div><div id="m" style="color:#fff;font-size:13px"></div>
<script>
const syms=['A','B','C','D','E','F','G','H'];let deck=[...syms,...syms].sort(()=>Math.random()-0.5);
let open=[],done=0,lock=false;
const g=document.getElementById('g');
deck.forEach((s,i)=>{const d=document.createElement('div');d.className='c';d.dataset.s=s;d.textContent=s;
d.onclick=()=>{if(lock||d.classList.contains('ok')||d.classList.contains('f'))return;
d.classList.add('f');open.push(d);if(open.length==2){lock=true;
const [a,b]=open;if(a.dataset.s==b.dataset.s){a.classList.add('ok');b.classList.add('ok');done++;document.getElementById('s').textContent='配对数 '+done+' / 8';open=[];lock=false;
if(done==8){document.getElementById('m').textContent='全部配对 ✓ 点击重开';}},else{setTimeout(()=>{a.classList.remove('f');b.classList.remove('f');open=[];lock=false},700)}}};
g.appendChild(d)});
document.body.addEventListener('click',e=>{if(e.target.id==''&&done==8){deck.sort(()=>Math.random()-0.5);location.reload()}});
let f=0,last=performance.now();function loop(t){f++;if(t-last>1000){window.__mapoFps=Math.round(f*1000/(t-last));f=0;last=t}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
